# Include this INSIDE the HTTPS server block for hitszjla.club.
# Existing /api/, /karuta/, /quiz/ and /quiz-release/ routes stay in place.
location = /community {
    return 301 /community/admin/;
}

location ^~ /community/static/ {
    alias /var/www/jla-community-admin-static/;
    expires 1h;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /community/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    client_max_body_size 16k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
