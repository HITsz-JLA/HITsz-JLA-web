{{ define "main" }}
<div class="community-page community-hub" data-community-page="participate">
  <header class="community-hero">
    <h1>留言&投稿</h1>
    <div class="community-actions" aria-label="留言与投稿">
      <button class="community-compose" type="button" data-compose="feedback" aria-haspopup="dialog" aria-controls="feedback-dialog">匿名留言</button>
      <button class="community-compose" type="button" data-compose="song" aria-haspopup="dialog" aria-controls="song-dialog">歌曲投稿</button>
    </div>
    <p class="community-status" id="community-notice" role="status" aria-live="polite"></p>
    <noscript><p>请启用 JavaScript，以查看公开留言和填写投稿。</p></noscript>
  </header>
  <section class="community-wall" aria-labelledby="wall-title">
    <div class="community-wall-heading"><h2 id="wall-title">公开留言</h2><span class="community-count" id="public-count">留言区</span></div>
    <p class="community-wall-intro">这里展示审核通过的留言和日语社的回复。</p>
    <div id="feedback-list" aria-live="polite"><div class="community-empty">正在读取留言…</div></div>
    <button class="community-secondary" id="load-more" type="button" hidden>查看更多留言</button>
    <button class="community-text-button" id="retry-list" type="button" hidden>重新加载留言</button>
  </section>
  {{ partial "community-dialog.html" (dict "kind" "feedback" "title" "匿名留言") }}
  {{ partial "community-dialog.html" (dict "kind" "song" "title" "歌曲投稿") }}
</div>
<script src="{{ "js/community.js" | relURL }}?v=3" defer></script>
{{ end }}
