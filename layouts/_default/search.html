{{ define "main" }}{{ partial "site/hero.html" . }}<form class="search-box" data-site-search role="search"><label class="sr-only" for="site-query">搜索全站内容</label><input id="site-query" name="q" type="search" placeholder="输入歌名、文章名、文法或活动…" autocomplete="off"><button class="primary" type="submit">搜索</button></form><div class="filter-tabs" aria-label="搜索内容类型">{{ range slice (slice "" "全部") (slice "lyrics" "歌曲") (slice "readings" "阅读") (slice "grammar" "文法") (slice "events" "活动") (slice "news" "公告") }}<button type="button" data-search-section="{{ index . 0 }}" aria-pressed="{{ eq (index . 0) "" }}">{{ index . 1 }}</button>{{ end }}</div><div class="section-heading"><h2 data-search-heading>想从哪里开始？</h2><small data-search-count aria-live="polite">搜索本站内容</small></div><div data-search-results><div class="sheet"><p>试试歌名、文章标题或文法关键词。</p></div></div>{{ end }}
