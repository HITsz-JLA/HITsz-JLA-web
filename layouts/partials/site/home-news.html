<section class="card notice"><span class="paper-tape" aria-hidden="true"></span><div class="heading"><h2>公告栏</h2><small>お知らせ</small></div>{{ range first 1 (where .Site.RegularPages "Section" "news").ByDate.Reverse }}<div class="summary"><div class="thumb"><img src="{{ "assets/club-logo.webp" | relURL }}" alt=""><b aria-hidden="true">♫</b></div><div><small>{{ .Date.Format "2006.01.02" }}</small><h3>{{ .Title }}</h3></div></div><p>{{ .Summary | plainify | htmlUnescape | truncate 70 }}</p><div class="notice-links"><a href="{{ .RelPermalink }}">查看公告 →</a><a href="{{ "/news/" | relURL }}">往期公告 ↗</a></div>{{ end }}</section>
