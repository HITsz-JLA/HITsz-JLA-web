{{ range first 1 (where .Site.RegularPages "Section" "events").ByDate.Reverse }}{{ $meta := partial "site/metadata.html" . }}<section class="card event"><img class="deco event-kiku" src="{{ "assets/fusion/chrysanthemum.svg" | relURL }}" alt="" aria-hidden="true"><div class="heading"><h2>社团日记</h2><small>思い出帖</small></div><div class="photo-frame"><img class="event-photo" src="{{ $meta.cover | default "/assets/club-photo.webp" | relURL }}" alt="{{ $meta.title }}"><span class="photo-stamp" aria-hidden="true">いい仲間。</span></div><div class="date"><span class="tag">活动记录</span><span>{{ .Date.Format "2006.01.02" }}</span></div><h3>{{ $meta.title }}</h3><p>{{ .Summary | plainify | htmlUnescape | truncate 120 }}</p><a class="more" href="{{ .RelPermalink }}">翻开这篇活动记录 →</a></section>{{ end }}
